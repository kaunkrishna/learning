<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Bubbling</title>
    <style>
        .container {
            text-align: center;
            background-color: lavender;
            border: 2px solid black;
            padding: 34px;
            margin: 34px;
        }

        .childContainer {
            text-align: center;
            background-color: beige;
            border: 2px solid black;
            padding: 34px;
            margin: 34px;
        }

        .child {
            text-align: center;
            background-color: aliceblue;
            border: 2px solid black;
            padding: 34px;
            margin: 34px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="childContainer">
            <div class="child">I'm a child!</div>
            </span>
        </div>
        <script>
            document.querySelector(".child").addEventListener("click", (e) => {
                e.stopPropagation()
                alert("are you a peadophile?");
            });

            document.querySelector(".childContainer").addEventListener("click", (e) => {
                e.stopPropagation()
                alert("wrong target");
            });

            document.querySelector(".container").addEventListener("click", () => {
                alert("wrong target");
            });

            function getRandomColor() {
                let value1 = Math.ceil(0 + Math.random() * 255);
                let value2 = Math.ceil(0 + Math.random() * 255);
                let value3 = Math.ceil(0 + Math.random() * 255);

                return `rgb(${value1}, ${value2}, ${value3})`
            }

            setInterval(() => {
                document.querySelector(".container").style.background = getRandomColor();
            }, 200);

            setInterval(() => {
                document.querySelector(".childContainer").style.background = getRandomColor();
            }, 200);

            setInterval(() => {
                document.querySelector(".child").style.background = getRandomColor();
            }, 200);

            //   setTimeout(() => {
            //     document.querySelector(".childContainer").style.background = getRandomColor();
            //   }, 1000);

        </script>
</body>

</html>
